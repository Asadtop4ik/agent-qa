services:
  agent-qa:
    image: ${AGENT_QA_IMAGE:?Set AGENT_QA_IMAGE to the loaded commit image}
    pull_policy: never
    container_name: agent-qa
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      AGENT_QA_GIT_SHA: ${AGENT_QA_SHA:?Set AGENT_QA_SHA to the deployed git SHA}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/ready', timeout=1)"]
      interval: 10s
      timeout: 2s
      retries: 3
